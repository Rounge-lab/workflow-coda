<svg
  xmlns="http://www.w3.org/2000/svg"
  class="coda-theme-icon"
  viewBox="0 0 24 24"
  width="24"
  height="24"
  fill="currentColor"
  data-coda-theme="light"
  aria-hidden="true"
  focusable="false"
>
  <defs>
    <!-- star, centered on the origin for easy scaling. -->
    <path
      id="coda-theme-icon-star"
      transform="translate(-16 -8)"
      d="m12 8
         c0-.73264 2.0242-.93969 2.5423-1.4577
         .51805-.51805 .7251-2.5423 1.4577-2.5423
         .73264 0 .93969 2.0242 1.4577 2.5423
         .51805 .51805 2.5423 .7251 2.5423 1.4577
         0 .73264-2.0242 .93969-2.5423 1.4577
         -.51805 .51805-.7251 2.5423-1.4577 2.5423
         -.73264 0-.93969-2.0242-1.4577-2.5423
         -.51805-.51805-2.5423-.7251-2.5423-1.4577z"
    />

    <!-- One downward ray; the other seven are rotated copies. -->
    <g id="coda-theme-icon-ray">
      <path
        d="m11 18.232v1.7676
           c0 .554 .446 1 1 1s1-.446 1-1
           v-1.7676
           c0-.27614-.19447-.38093-.45968-.30661
           -.17513 .049078-.35689 .074249-.54032 .07419
           -.18344 .000059-.3652-.02511-.54033-.07419
           -.2652-.074321-.45967 .03047-.45967 .30661z"
      />
    </g>
  </defs>

  <g class="coda-theme-icon-layer coda-theme-icon-moon">
    <path
      class="coda-theme-icon-crescent"
      d="m11 5
         a8 8 0 0 0-8 8
         8 8 0 0 0 8 8
         8 8 0 0 0 7.5781-5.4395
         6.5 6.5 0 0 1-4.0781 1.4395
         6.5 6.5 0 0 1-6.5-6.5
         6.5 6.5 0 0 1 3.0352-5.5
         8 8 0 0 0-.035156 0z"
    />

    <g class="coda-theme-icon-star coda-theme-icon-star-a">
      <use href="#coda-theme-icon-star" />
    </g>

    <g class="coda-theme-icon-star coda-theme-icon-star-b">
      <use href="#coda-theme-icon-star" />
    </g>
  </g>

  <g class="coda-theme-icon-layer coda-theme-icon-sun">
    <circle class="coda-theme-icon-disc" cx="12" cy="12" r="4.5" />

    <g>
