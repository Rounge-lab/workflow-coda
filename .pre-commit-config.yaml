default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: pixi run ruff check --fix
        language: system
        types_or:
          - python
          - pyi
        pass_filenames: true

      - id: ruff-format
        name: ruff format
        entry: pixi run ruff format
        language: system
        types_or:
          - python
          - pyi
        pass_filenames: true

      - id: pytest
        name: pytest
        entry: pixi run pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: mypy
        name: mypy
        entry: pixi run mypy
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
