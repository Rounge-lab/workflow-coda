[workspace]
name = "workflow-coda"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.14.*"

[pypi-dependencies]
workflow-coda = {
    path = ".",
    editable = true,
    extras = ["dev", "docs"]
}

[tasks]
pytest = "pytest"
mypy = "mypy ."
ruff-check = "ruff check ."
ruff-format-check = "ruff format --check ."
ruff-format = "ruff format ."

format = { depends-on = ["ruff-format"] }
lint = { depends-on = ["ruff-check", "ruff-format-check"] }
test = { depends-on = ["lint", "mypy", "pytest"] }
docs = {
    cmd = "sphinx-build -M html ./source ./build --fail-on-warning",
    cwd = "docs/dev",
}
