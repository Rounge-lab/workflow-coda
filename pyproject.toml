[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-coda"
version = "0.2.0"
authors = [
    {name = "Sverre Branders", email = "sverrbra@uio.no"},
]
readme = { file = "README.rst", content-type = "text/x-rst" }
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
requires-python = ">=3.14"
dependencies = [
    "jinja2>=3.1",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "plotly>=7.1",
    "pydantic>=2.13",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/sverre-branders/workflow-coda"
Issues = "https://github.com/sverre-branders/workflow-coda/issues"

[project.optional-dependencies]
dev = [
    "build",
    "mypy>=2.4",
    "pre-commit>=4.6",
    "pytest-cov",
    "pytest>=9",
    "ruff>=0.16",
    "types-pyyaml",
]
docs = [
    "build",
    "autodoc-pydantic",
    "sphinx",
    "sphinx-copybutton",
    "sphinx-rtd-dark-mode",
    "sphinx-rtd-theme",
]

[project.scripts]
workflow-coda = "workflow_coda.cli:main"

[project.entry-points."workflow_coda.plugins"]
core = "workflow_coda.core.plugin:get_plugin"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workflow_coda = [
    "templates/*",
    "core/assets/icons/*.svg",
    "core/assets/*.css",
    "core/assets/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--tb=short",
]

[tool.ruff]
exclude = [
    ".git",
    "__pypackages__",
]
line-length = 88
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "B",
    "I",
    "N",
    "C90",
    "W",
    "Q",
    "RET",
    "UP",
]
ignore = ["E501"] # Should be handled by ruff format
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
exclude = ["^docs/"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

strict_equality = true
warn_redundant_casts = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["plotly", "plotly.*"]
ignore_missing_imports = true
