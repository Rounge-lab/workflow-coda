name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0; without v)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: workflow-coda-release
  cancel-in-progress: false

jobs:
  guard:
    name: Validate release request
    runs-on: ubuntu-latest
    steps:
      - name: Releases may only be dispatched from main
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" != "main" ]]; then
            echo "::error::Releases may only be dispatched from main."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      - name: Assert version matches source and tag is new
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          pixi run python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          requested = os.environ["RELEASE_VERSION"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", requested):
              raise SystemExit("Expected a version such as 0.3.0, without v.")

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          actual = project["version"]
          if requested != actual:
              raise SystemExit(
                  f"Requested version {requested} does not match "
                  f"pyproject.toml version {actual}."
              )
          PY

          if git show-ref --verify --quiet "refs/tags/v${RELEASE_VERSION}"; then
            echo "::error::Tag v${RELEASE_VERSION} already exists."
            exit 1
          fi

  checks:
    name: Tests and documentation
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      - name: Lint, type-check, and test
        run: pixi run test

      - name: Build documentation
        run: pixi run -e docs docs

  release:
    name: Build and publish GitHub release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      - name: Build source distribution and wheel
        run: pixi run build

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.whl > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "v${RELEASE_VERSION}" \
            dist/*.tar.gz \
            dist/*.whl \
            dist/SHA256SUMS \
            --target "$RELEASE_COMMIT" \
            --title "v${RELEASE_VERSION}" \
            --generate-notes
